<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Josué da Silva Cavalcante · Academic homepage</title>
    <meta
      name="description"
      content="Academic homepage of Josué da Silva Cavalcante, physicist and astronomer. Available in English and Brazilian Portuguese."
    />
    <link rel="canonical" href="https://wolf9611.github.io/en/" />
    <link rel="alternate" hreflang="en" href="https://wolf9611.github.io/en/" />
    <link
      rel="alternate"
      hreflang="pt-BR"
      href="https://wolf9611.github.io/pt/"
    />
    <link
      rel="alternate"
      hreflang="x-default"
      href="https://wolf9611.github.io/en/"
    />
    <meta name="theme-color" content="#121214" />
    <meta name="color-scheme" content="dark light" />
    <link
      rel="icon"
      href="/assets/mark/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link rel="apple-touch-icon" href="/assets/mark/apple-touch-180.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&family=IBM+Plex+Serif:ital,wght@0,400;0,500;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/style.css?v=5" />
    <script src="/js/main.js?v=5"></script>
    <script>
      /* Language negotiation: stored preference, then browser language, then English. */
      (function () {
        "use strict";
        var preference = null;
        try {
          preference = localStorage.getItem("jdc-lang");
        } catch (e) {
          /* private mode */
        }
        var language =
          preference ||
          (navigator.languages && navigator.languages[0]) ||
          navigator.language ||
          "en";
        window.location.replace(/^pt/i.test(language) ? "/pt/" : "/en/");
      })();
    </script>
    <noscript><meta http-equiv="refresh" content="0; url=/en/" /></noscript>
  </head>
  <body>
    <main id="main-content" class="page-redirect">
      <p class="redirect-name">Josué da Silva Cavalcante</p>
      <p class="redirect-tag">
        Astronomy · Small bodies · Astrometry · Machine learning
      </p>
      <nav class="redirect-choose" aria-label="Language">
        <a
          class="redirect-link"
          href="/en/"
          hreflang="en"
          lang="en"
          data-lang="en"
          >Read in English</a
        >
        <a
          class="redirect-link"
          href="/pt/"
          hreflang="pt-BR"
          lang="pt-BR"
          data-lang="pt-BR"
          >Ler em português</a
        >
      </nav>
    </main>
  </body>
</html>
